name: Release

# Tags are created and pushed manually. This workflow never creates a tag.
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.policy.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release tooling
        run: python3 -m unittest discover -s .scripts/tests -v
      - name: Validate version, tag, and stable release ancestry
        id: policy
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .scripts/release_policy.py --tag "$RELEASE_TAG" --stable-ref "origin/$DEFAULT_BRANCH"

  packages:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ github.ref_name }}

  publish:
    name: Publish release
    needs: [validate, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create source archive and checksums
        run: |
          git archive --format=tar.gz \
            --prefix="im_sample_algorithm-$RELEASE_TAG/" \
            --output="dist/im_sample_algorithm-$RELEASE_TAG-source.tar.gz" HEAD
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Prepare draft release
        run: |
          # Reruns may repair a draft, but must not overwrite a published release.
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Release already published; refusing to replace assets"'
          else
            prerelease_args=()
            if [ "$PRERELEASE" = true ]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
              --title "$RELEASE_TAG" "${prerelease_args[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
      - name: Publish complete release
        run: |
          latest=false
          if [ "$PRERELEASE" = false ]; then
            latest=true
          fi
          gh release edit "$RELEASE_TAG" --draft=false \
            --prerelease="$PRERELEASE" --latest="$latest"
