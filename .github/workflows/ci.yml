name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    name: Release policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test release tooling
        run: python3 -m unittest discover -s .scripts/tests -v
      - name: Validate CMake version
        run: python3 .scripts/release_policy.py

  build-and-test:
    uses: ./.github/workflows/build.yml

  required:
    name: CI required
    runs-on: ubuntu-24.04
    if: always()
    needs: [release-policy, build-and-test]
    steps:
      - name: Require every validation job to pass
        env:
          POLICY_RESULT: ${{ needs.release-policy.result }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
        run: |
          test "$POLICY_RESULT" = success
          test "$BUILD_RESULT" = success
